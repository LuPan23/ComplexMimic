# if given, will override the device setting in gym. 
task: HumanoidIm
project_name: "ComplexMimic"
motion_file: "./data/TRUMANS/trumans_motion_train.pkl"
mapping_json: "./data/TRUMANS/trumans_train.json"
scene_dir: "./data/TRUMANS/trumans_scene_mesh"
num_envs: 512
env_spacing: 5
episode_length: 300
self_obs_v: 1
obs_v: 7
min_length: 5

kp_scale: 1
power_reward: True

shape_resampling_interval: 500

control_mode: "isaac_pd"
power_scale: 1.0
controlFrequencyInv: 2 # 30 Hz
stateInit: "Random"  
hybridInitProb: 0.5
numAMPObsSteps: 10

local_root_obs: True
root_height_obs: True
key_bodies: ["R_Ankle", "L_Ankle", "R_Wrist",  "L_Wrist"]
contact_bodies: ["R_Ankle", "L_Ankle", "R_Toe", "L_Toe"]
reset_bodies: ['Pelvis', 'L_Hip', 'L_Knee', 'R_Hip', 'R_Knee', 'Torso', 'Spine', 'Chest', 'Neck', 'Head', 'L_Thorax', 'L_Shoulder', 'L_Elbow', 'L_Wrist', 'L_Hand', 'R_Thorax', 'R_Shoulder', 'R_Elbow', 'R_Wrist', 'R_Hand']
terminationHeight: 0.15
enableEarlyTermination: True
terminationDistance: 0.5

### Fut config
numTrajSamples: 3
trajSampleTimestepInv: 3
enableTaskObs: True


plane:
  staticFriction: 1.0
  dynamicFriction: 1.0
  restitution: 0.0

use_heightmap: True
empty_heightmap: False
heightmap_dir: ./data/heightmaps   
heightmap_resolution: 0.02   
height_patch_size: 20        
show_heightmap_dots: False
patch_resolution: 0.08
load_scene_mesh: True
